appId: com.app.toolbox
productName: 工具箱
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/py_server
    to: py_server
    filter:
      - '**/*'
win:
  executableName: 工具箱
nsis:
  oneClick: false # 关闭一键安装，启用经典向导安装界面
  allowToChangeInstallationDirectory: true # 允许用户自定义安装路径
  allowElevation: true # 允许请求管理员权限
  perMachine: false # 默认仅为当前用户安装（不需要强制管理员权限），也可在安装时切换
  createDesktopShortcut: always # 始终创建桌面快捷方式
  createStartMenuShortcut: true # 创建开始菜单快捷方式
  shortcutName: ${productName} # 快捷方式名称
  uninstallDisplayName: ${productName} # 控制面板卸载名称
  artifactName: ${name}-${version}-setup.${ext} # 安装包文件名
  license: build/license.txt # 用户许可协议条款
  runAfterFinish: true # 安装完成后勾选“运行软件”
  language: "2052" # 简体中文向导界面
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
